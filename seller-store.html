<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller Store | KisanSetu</title><link rel="stylesheet" href="styles.css"><style>.wrap{max-width:1120px;margin:105px auto 60px;padding:0 22px}.hero{background:#173d27;color:#fff;border-radius:26px;padding:32px;margin-bottom:22px}.hero small{color:#c7e8b3;letter-spacing:.12em;font-weight:800}.hero h1{margin:8px 0;font-size:clamp(32px,5vw,54px)}.hero p{margin:6px 0;color:#d8e8dd}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid #e0e9e2;border-radius:18px;overflow:hidden}.card img{width:100%;height:190px;object-fit:cover}.body{padding:16px}.cat{font-size:.75rem;color:#52715b;text-transform:uppercase;font-weight:800}.price{font-size:22px;font-weight:900;margin:8px 0}.stock{font-size:.85rem;color:#657269}.btn{display:block;text-align:center;background:#1e6b37;color:#fff;padding:11px;border-radius:10px;text-decoration:none;font-weight:800;margin-top:12px}.verified{display:inline-block;background:#dff1df;color:#1f6b38;border-radius:999px;padding:6px 10px;font-size:.78rem;font-weight:800}.back{display:inline-block;margin-bottom:15px;color:#1e6b37;font-weight:800}.store-toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.store-toolbar input,.store-toolbar select{padding:12px 14px;border:1px solid #d7e3da;border-radius:11px;background:#fff}.store-toolbar input{flex:1;min-width:220px}.count{color:#68746c;font-size:.9rem;margin-bottom:12px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}.card img{height:220px}} .reviews{margin-top:28px}.review-summary{display:flex;gap:18px;align-items:center;background:#f5faf6;border:1px solid #dce9df;border-radius:16px;padding:16px;margin-bottom:14px}.stars{letter-spacing:2px}.review-list{display:grid;gap:10px}.review{border:1px solid #e2eae4;border-radius:14px;padding:14px}.review-head{display:flex;justify-content:space-between;gap:10px}.review small{color:#68746c}.review p{margin:8px 0 0}.empty{color:#68746c}</style></head><body><nav class="navbar"><a href="marketplace.html" class="brand">🌱 KisanSetu</a><div class="nav-links"><a href="marketplace.html">Marketplace</a><a href="dashboard.html">My Orders</a></div></nav><main class="wrap"><a class="back" href="marketplace.html">← Back to marketplace</a><section id="hero" class="hero">Loading store…</section><section><h2>Products from this store</h2><div class="store-toolbar"><input id="q" placeholder="Search products in this store"><select id="sort"><option value="new">Newest</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option></select></div><div id="count" class="count"></div><div id="products" class="grid"></div></section><section class="reviews"><h2>Customer reviews</h2><div id="reviewSummary" class="review-summary">Loading reviews…</div><div id="reviewList" class="review-list"></div></section></main><script>const $=id=>document.getElementById(id);function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));}function money(n){return "₹"+Number(n).toLocaleString("en-IN",{maximumFractionDigits:2});}async function load(){const id=new URLSearchParams(location.search).get("id");if(!id){$("hero").textContent="Seller not found.";return;}const r=await fetch("/api/sellers/"+encodeURIComponent(id));const d=await r.json();if(!r.ok){$("hero").textContent=d.error||"Seller not found.";return;}const s=d.seller;storeProducts=d.products||[];$("hero").innerHTML="<small>VERIFIED KISANSETU SELLER</small><h1>"+esc(s.store_name)+"</h1><span class='verified'>✓ Verified store</span><p>📍 "+esc(s.city)+", "+esc(s.state)+" "+esc(s.pincode)+"</p><p>📞 "+esc(s.phone)+"</p><p>"+esc(s.address)+"</p>";renderProducts();loadReviews(storeProducts);}function renderProducts(){const q=$("q").value.trim().toLowerCase();let list=storeProducts.filter(p=>!q||String(p.name).toLowerCase().includes(q)||String(p.category).toLowerCase().includes(q));const s=$("sort").value;if(s==="low")list.sort((a,b)=>Number(a.price)-Number(b.price));if(s==="high")list.sort((a,b)=>Number(b.price)-Number(a.price));$("count").textContent=list.length+" product"+(list.length===1?"":"s");$("products").innerHTML=list.map(p=>"<article class='card'><img src='"+esc(p.image||"https://images.unsplash.com/photo-1625246333195-78d9c38ad449?auto=format&fit=crop&w=900&q=80")+"' alt='"+esc(p.name)+"'><div class='body'><span class='cat'>"+esc(p.category)+"</span><h3>"+esc(p.name)+"</h3><div class='price'>"+money(p.price)+"</div><div class='stock'>"+(p.stock>0?p.stock+" units available":"Out of stock")+"</div><a class='btn' href='marketplace.html'>View in marketplace</a></div></article>").join("")||"<p>No matching products found.</p>";} async function loadReviews(products){const all=[];for(const p of products){try{const r=await fetch("/api/products/"+p.id+"/reviews");if(r.ok){const d=await r.json();(d.reviews||[]).forEach(x=>all.push({...x,productName:p.name}));}}catch(e){}}all.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));const avg=all.length?all.reduce((s,x)=>s+Number(x.rating),0)/all.length:0;$("reviewSummary").innerHTML=all.length?"<strong style="font-size:1.5rem">"+avg.toFixed(1)+" / 5</strong><span class="stars">"+("★".repeat(Math.round(avg))+"☆".repeat(5-Math.round(avg)))+"</span><span>"+all.length+" verified review"+(all.length===1?"":"s")+"</span>":"<strong>No reviews yet</strong><span>Reviews appear after delivered orders.</span>";$("reviewList").innerHTML=all.length?all.slice(0,12).map(x=>"<article class="review"><div class="review-head"><strong>"+esc(x.productName)+"</strong><span class="stars">"+("★".repeat(Number(x.rating))+"☆".repeat(5-Number(x.rating)))+"</span></div><small>"+esc(x.user_name||"Verified buyer")+" • "+new Date(x.created_at).toLocaleDateString()+"</small><p>"+esc(x.comment||"Rated this product.")+"</p></article>").join(""):"<div class="empty">Be the first customer to review a product from this store.</div>";}loadReviews(d.products||[]);}$("q").addEventListener("input",renderProducts);$("sort").addEventListener("change",renderProducts);load();</script></body></html>
