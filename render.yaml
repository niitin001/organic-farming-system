services:
  - type: web
    name: organic-farming-system
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: organic-farming-db
          property: connectionString

databases:
  - name: organic-farming-db
    databaseName: organic_farming
    user: organic_farming_user
