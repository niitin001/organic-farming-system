<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller Dashboard | KisanSetu</title><link rel="stylesheet" href="styles.css"><style>
.wrap{max-width:1150px;margin:105px auto 60px;padding:0 22px}.top{display:flex;justify-content:space-between;gap:15px;align-items:end;margin-bottom:18px}.panel{background:#fff;border:1px solid #dfe9e2;border-radius:20px;padding:20px;margin-bottom:18px}.form{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 2fr;gap:10px}.form input{padding:12px;border:1px solid #d7e3da;border-radius:10px}.btn{border:0;background:#1e6b37;color:#fff;border-radius:10px;padding:12px;font-weight:800;cursor:pointer}.products,.orders{display:grid;gap:14px}.item,.order{border:1px solid #e0e9e2;border-radius:15px;padding:16px}.item h3,.order h3{margin:0 0 6px}.meta{color:#647069;font-size:.88rem}.msg{font-weight:700;margin-top:10px}.order-head{display:flex;justify-content:space-between;gap:12px;align-items:start}.status{border-radius:999px;padding:6px 10px;background:#edf6ef;color:#1e6b37;font-size:.78rem;font-weight:800;text-transform:capitalize}.order-items{margin:12px 0;padding:12px;background:#f7faf7;border-radius:12px}.order-item{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:.9rem}.order-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.order-actions select{padding:10px;border:1px solid #d7e3da;border-radius:10px}.empty{color:#647069;padding:8px 0}@media(max-width:850px){.form{grid-template-columns:1fr 1fr}.order-head{display:block}}@media(max-width:550px){.form{grid-template-columns:1fr}}
</style></head><body><nav class="navbar"><a href="marketplace.html" class="brand">🌱 KisanSetu</a><div class="nav-links"><a href="marketplace.html">Marketplace</a><a href="dashboard.html">Farmer Dashboard</a></div></nav>
<main class="wrap"><div class="top"><div><span>🏪 SELLER CENTER</span><h1 id="store">Seller Dashboard</h1><p id="status"></p></div></div>
<section class="panel"><h2>Add product</h2><form id="form" class="form"><input id="name" required placeholder="Product name"><input id="category" required placeholder="Category"><input id="price" type="number" min="0" step="0.01" required placeholder="Price ₹"><input id="stock" type="number" min="0" required placeholder="Stock"><input id="image" placeholder="Product image URL"><button class="btn">Add product</button></form><div id="msg" class="msg"></div></section>
<section class="panel"><h2>Orders from farmers</h2><p class="meta">Manage only the orders containing your verified-store products.</p><div id="orders" class="orders"></div></section>
<section class="panel"><h2>Your live products</h2><div id="products" class="products"></div></section></main>
<script>
const token=localStorage.getItem("ffs_token");if(!token)location.href="login.html?next=seller-dashboard.html";const $=id=>document.getElementById(id);
async function api(url,opts={}){opts.headers={...(opts.headers||{}),Authorization:"Bearer "+token,"Content-Type":"application/json"};return fetch(url,opts);}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));}
function money(n){return "₹"+Number(n).toLocaleString("en-IN",{maximumFractionDigits:2});}
async function load(){const r=await api("/api/seller/me");if(!r.ok){$("status").textContent="Please complete seller onboarding.";return;}const d=await r.json();if(!d.seller||d.seller.status!=="approved"){location.href="seller.html";return;}$("store").textContent=d.seller.store_name;$("status").textContent="✓ Verified seller • "+d.seller.city+", "+d.seller.state;await loadProducts();await loadOrders();}
async function loadProducts(){const p=await api("/api/seller/products");const pd=await p.json();$("products").innerHTML=(pd.products||[]).map(x=>"<article class='item'><h3>"+esc(x.name)+"</h3><div class='meta'>"+esc(x.category)+" • "+money(x.price)+" • "+x.stock+" in stock</div></article>").join("")||"<p class='empty'>No products yet.</p>";}
const statuses=["pending","confirmed","packed","shipped","delivered","cancelled"];
async function loadOrders(){const r=await api("/api/seller/orders");const d=await r.json();if(!r.ok){$("orders").innerHTML="<p class='empty'>"+esc(d.error||"Unable to load orders.")+"</p>";return;}$("orders").innerHTML=(d.orders||[]).map(o=>"<article class='order'><div class='order-head'><div><h3>Order #"+o.order_id+"</h3><div class='meta'>Customer: "+esc(o.customer_name)+" • "+esc(o.customer_email)+"</div></div><span class='status'>"+esc(o.status)+"</span></div><div class='order-items'>"+o.items.map(i=>"<div class='order-item'><span>"+esc(i.name)+" × "+i.quantity+"</span><strong>"+money(Number(i.price)*i.quantity)+"</strong></div>").join("")+"</div><div><strong>Seller total: "+money(o.seller_total)+"</strong></div><div class='order-actions'><select id='s-"+o.seller_order_id+"'>"+statuses.map(s=>"<option value='"+s+"' "+(s===o.status?"selected":"")+">"+s+"</option>").join("")+"</select><button class='btn' onclick='updateOrder("+o.seller_order_id+")'>Update status</button></div></article>").join("")||"<p class='empty'>No farmer orders yet.</p>";}
async function updateOrder(id){const status=$( "s-"+id).value;const r=await api("/api/seller/orders/"+id,{method:"PATCH",body:JSON.stringify({status})});const d=await r.json();$("msg").textContent=r.ok?"Order status updated.":(d.error||"Unable to update order.");if(r.ok)loadOrders();}
$("form").addEventListener("submit",async e=>{e.preventDefault();const body={name:$("name").value.trim(),category:$("category").value.trim(),price:Number($("price").value),stock:Number($("stock").value),image:$("image").value.trim()};const r=await api("/api/seller/products",{method:"POST",body:JSON.stringify(body)});const d=await r.json();$("msg").textContent=d.product?"Product added.":"Error: "+(d.error||"Unable to add product.");if(r.ok){e.target.reset();loadProducts();}});
load();
</script></body></html>
