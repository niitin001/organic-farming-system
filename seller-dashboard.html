<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller Dashboard | KisanSetu</title><link rel="stylesheet" href="styles.css"><style>
.wrap{max-width:1100px;margin:105px auto 60px;padding:0 22px}.top{display:flex;justify-content:space-between;gap:15px;align-items:end;margin-bottom:18px}.panel{background:#fff;border:1px solid #dfe9e2;border-radius:20px;padding:20px;margin-bottom:18px}.form{display:grid;grid-template-columns:2fr 1fr 1fr 2fr;gap:10px}.form input{padding:12px;border:1px solid #d7e3da;border-radius:10px}.btn{border:0;background:#1e6b37;color:#fff;border-radius:10px;padding:12px;font-weight:800;cursor:pointer}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.item{border:1px solid #e0e9e2;border-radius:15px;padding:15px}.item h3{margin:0 0 5px}.meta{color:#647069;font-size:.88rem}.msg{font-weight:700;margin-top:10px}@media(max-width:800px){.form{grid-template-columns:1fr 1fr}.products{grid-template-columns:1fr 1fr}}@media(max-width:550px){.form,.products{grid-template-columns:1fr}}
</style></head><body><nav class="navbar"><a href="marketplace.html" class="brand">🌱 KisanSetu</a><div class="nav-links"><a href="marketplace.html">Marketplace</a><a href="dashboard.html">Farmer Dashboard</a></div></nav>
<main class="wrap"><div class="top"><div><span>🏪 SELLER CENTER</span><h1 id="store">Seller Dashboard</h1><p id="status"></p></div></div>
<section class="panel"><h2>Add product</h2><form id="form" class="form"><input id="name" required placeholder="Product name"><input id="category" required placeholder="Category"><input id="price" type="number" min="0" step="0.01" required placeholder="Price ₹"><input id="stock" type="number" min="0" required placeholder="Stock"><input id="image" placeholder="Product image URL"><button class="btn">Add product</button></form><div id="msg" class="msg"></div></section>
<section class="panel"><h2>Your live products</h2><div id="products" class="products"></div></section></main>
<script>
const token=localStorage.getItem("ffs_token");if(!token)location.href="login.html?next=seller-dashboard.html";const $=id=>document.getElementById(id);
async function api(url,opts={}){opts.headers={...(opts.headers||{}),Authorization:"Bearer "+token,"Content-Type":"application/json"};return fetch(url,opts);}
async function load(){const r=await api("/api/seller/me");if(!r.ok){$("status").textContent="Please complete seller onboarding.";return;}const d=await r.json();if(!d.seller||d.seller.status!=="approved"){location.href="seller.html";return;}$("store").textContent=d.seller.store_name;$("status").textContent="✓ Verified seller • "+d.seller.city+", "+d.seller.state;const p=await api("/api/seller/products");const pd=await p.json();$("products").innerHTML=(pd.products||[]).map(x=>"<article class='item'><h3>"+x.name+"</h3><div class='meta'>"+x.category+" • ₹"+Number(x.price).toLocaleString("en-IN")+" • "+x.stock+" in stock</div></article>").join("")||"<p>No products yet.</p>";}
$("form").addEventListener("submit",async e=>{e.preventDefault();const body={name:$("name").value.trim(),category:$("category").value.trim(),price:Number($("price").value),stock:Number($("stock").value),image:$("image").value.trim()};const r=await api("/api/seller/products",{method:"POST",body:JSON.stringify(body)});const d=await r.json();$("msg").textContent=d.product?"Product added.":"Error: "+(d.error||"Unable to add product.");if(r.ok){e.target.reset();load();}});
load();
</script></body></html>
