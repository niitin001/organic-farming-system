<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up</title>
  <style>
    body {
      background: #0b3f0d;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial;
    }

    .box {
      background: white;
      width: 360px;
      padding: 25px;
      border-radius: 10px;
      text-align: center;
    }

    .box h2 {
      margin-bottom: 15px;
    }

    input {
      width: 90%;
      margin: 8px 0;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #aaa;
    }

    button {
      width: 85%;
      padding: 10px;
      background: #0b3f0d;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }

    p span {
      color: blue;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>Create Your Account</h2>

    <input type="text" id="name" placeholder="Full Name" required>
    <input type="email" id="email" placeholder="Enter Email" required>
    <input type="password" id="password" placeholder="Create Password" required>

    <button onclick="signup()">Sign Up</button>

    <p>Already have an account? 
      <span onclick="window.location.href='login.html'">Login</span>
    </p>
  </div>

  <script>
    const form = document.querySelector(".box");
    async function signup() {
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value;

      if (!name || !email || password.length < 6) {
        alert("Please enter your name, a valid email and a password of at least 6 characters.");
        return;
      }

      try {
        const response = await fetch("/api/signup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, email, password })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Signup failed.");

        localStorage.setItem("ffs_token", data.token);
        localStorage.setItem("ffs_user", JSON.stringify(data.user));
        localStorage.setItem("ffs_logged", data.user.email);
        alert("Account created successfully!");
        window.location.href = "index.html";
      } catch (error) {
        alert(error.message);
      }
    }
  </script>

</body>
</html>
