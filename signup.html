<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account | Farmer Friendly</title><link rel="stylesheet" href="styles.css"></head>
<body class="auth-page"><main class="auth-box">
<a class="auth-logo" href="index.html"><span>🌱</span> Farmer Friendly</a>
<h1>Start your smart farm.</h1><p>Create an account to save crops, plan farm activities and track marketplace orders.</p>
<form id="signupForm"><input type="text" id="name" placeholder="Full name" autocomplete="name" required><input type="email" id="email" placeholder="Email address" autocomplete="email" required><input type="password" id="password" placeholder="Create password (6+ characters)" autocomplete="new-password" minlength="6" required><button type="submit">Create account →</button></form>
<p class="switch">Already have an account? <a href="login.html">Sign in</a></p><a class="back-home" href="index.html">← Back to home</a>
</main><script>
document.getElementById("signupForm").addEventListener("submit",async e=>{e.preventDefault();const name=document.getElementById("name").value.trim(),email=document.getElementById("email").value.trim().toLowerCase(),password=document.getElementById("password").value;if(!name||!email||password.length<6){alert("Please enter your name, a valid email and a password of at least 6 characters.");return}const btn=e.target.querySelector("button");btn.disabled=true;btn.textContent="Creating account…";try{const r=await fetch("/api/signup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,email,password})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Signup failed.");localStorage.setItem("ffs_token",d.token);localStorage.setItem("ffs_user",JSON.stringify(d.user));localStorage.setItem("ffs_logged",d.user.email);location.href="index.html";}catch(err){alert(err.message)}finally{btn.disabled=false;btn.textContent="Create account →"}});
</script></body></html>
