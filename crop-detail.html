<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crop Details | Farmer Friendly</title>
<link rel="stylesheet" href="styles.css">
<style>
body{padding-top:86px;background:var(--cream)}.crop-page{padding:55px 0 90px}.back{color:var(--green);font-weight:800;font-size:13px}.hero-card{margin-top:20px;background:var(--green-dark);color:#fff;border-radius:28px;padding:38px;display:flex;justify-content:space-between;gap:30px;align-items:end}.icon{font-size:55px}.eyebrow{color:var(--lime);font-size:11px;letter-spacing:.16em;font-weight:900}.hero-card h1{font:800 clamp(38px,6vw,68px)/1 Manrope;margin:8px 0}.hero-card p{color:rgba(255,255,255,.72);max-width:650px}.hero-meta{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;min-width:300px}.meta{padding:15px;border:1px solid rgba(255,255,255,.13);border-radius:14px;background:rgba(255,255,255,.06)}.meta small{display:block;color:var(--lime);font-size:9px;text-transform:uppercase;letter-spacing:.1em}.meta b{display:block;margin-top:3px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:20px;margin-top:20px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:0 8px 30px rgba(8,48,36,.045)}.card h2{font:800 23px Manrope;margin-bottom:10px}.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}.fact{padding:16px;background:var(--green-soft);border-radius:14px}.fact span{display:block;color:var(--muted);font-size:11px}.fact b{display:block;margin-top:4px}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}.chip{padding:8px 11px;border-radius:999px;background:#f0f4ef;font-size:12px;font-weight:700}.note{margin-top:20px;padding:15px;border-left:3px solid var(--lime);background:#f7f9ef;color:#53635b;font-size:12px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.btn2{padding:11px 15px;border-radius:11px;border:1px solid var(--line);font-weight:800;font-size:12px}.primary{background:var(--green);color:#fff;border-color:var(--green)}@media(max-width:800px){.hero-card,.grid{display:block}.hero-meta{margin-top:25px;min-width:0}.card{margin-bottom:18px}.facts{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="site-header"><div class="header-inner"><a class="brand" href="index.html"><span class="brand-mark">🌱</span><span><strong>Farmer</strong> Friendly</span></a><nav class="main-nav"><a href="index.html" data-i18n="home">Home</a><a href="crop-recommendation.html">Smart Crop</a><a href="weather.html" data-i18n="weather">Weather</a><a href="marketplace.html" data-i18n="marketplace">Marketplace</a><div class="lang-switch"><button data-lang="en" class="active">EN</button><button data-lang="hi">हि</button></div></nav></div></header>
<main class="crop-page"><div class="container">
<div style="display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap"><a class="back" href="crop-recommendation.html">← Back to Smart Crop</a><select id="cropSelect" style="padding:11px 14px;border:1px solid var(--line);border-radius:11px;background:#fff;font-weight:700"><option value="Rice">🌾 Rice</option><option value="Soybean">🫘 Soybean</option><option value="Maize">🌽 Maize</option><option value="Wheat">🌿 Wheat</option><option value="Gram (Chickpea)">🫛 Gram (Chickpea)</option><option value="Mustard">🌼 Mustard</option><option value="Groundnut">🥜 Groundnut</option><option value="Moong Bean">🌱 Moong Bean</option><option value="Vegetables">🥬 Vegetables</option></select></div>
<div id="app"><div class="card" style="margin-top:20px">Loading crop details…</div></div>
</div></main>
<script>
(function(){const dict={hi:{marketplace:"मार्केटप्लेस",home:"होम",dashboard:"डैशबोर्ड",weather:"मौसम"}};function setLang(l){localStorage.setItem("ffs_lang",l);document.querySelectorAll("[data-i18n]").forEach(e=>{const k=e.dataset.i18n;if(l==="hi"&&dict.hi[k])e.textContent=dict.hi[k];});document.querySelectorAll("[data-lang]").forEach(b=>b.classList.toggle("active",b.dataset.lang===l));}document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>setLang(b.dataset.lang));setLang(localStorage.getItem("ffs_lang")||"en");})();
</script><script>
const params=new URLSearchParams(location.search),name=params.get("name")||"Rice";
const selector=document.getElementById("cropSelect"); selector.value=name; selector.onchange=()=>location.href="crop-detail.html?name="+encodeURIComponent(selector.value);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",""":"&quot;","'":"&#039;"}[c]));
const labels={kharif:"Kharif",rabi:"Rabi",zaid:"Zaid"};
async function load(){
 if(!name){document.getElementById("app").innerHTML='<div class="card">Choose a crop from Smart Crop Recommendation.</div>';return}
 try{
  const r=await fetch("/api/crops/"+encodeURIComponent(name));const d=await r.json();if(!r.ok)throw new Error(d.error||"Unable to load crop.");
  const c=d.crop;
  document.getElementById("app").innerHTML=`
  <section class="hero-card"><div><div class="icon">${esc(c.icon)}</div><div class="eyebrow">CROP DETAIL DASHBOARD</div><h1>${esc(c.name)}</h1><p>${esc(c.description)}</p></div><div class="hero-meta"><div class="meta"><small>Season</small><b>${c.seasons.map(x=>labels[x]||x).join(" · ")}</b></div><div class="meta"><small>Water</small><b>${esc(c.water_requirement)}</b></div><div class="meta"><small>Duration</small><b>${esc(c.duration)}</b></div><div class="meta"><small>Soil</small><b>${c.soils.map(esc).join(" · ")}</b></div></div></section>
  <div class="grid"><section class="card"><h2>Growing profile</h2><p style="color:var(--muted);font-size:13px">${esc(c.reason)}</p><div class="facts"><div class="fact"><span>Suitable seasons</span><b>${c.seasons.map(x=>labels[x]||x).join(", ")}</b></div><div class="fact"><span>Suitable soil</span><b>${c.soils.map(esc).join(", ")}</b></div><div class="fact"><span>Water requirement</span><b>${esc(c.water_requirement)}</b></div><div class="fact"><span>Crop duration</span><b>${esc(c.duration)}</b></div></div><div class="actions"><a class="btn2 primary" href="farm-planner.html">📅 Open Farm Planner</a><a class="btn2" href="disease-guide.html">🩺 Disease Guide</a></div></section>
  <aside class="card"><h2>Planning checklist</h2><div class="chips"><span class="chip">🌱 Check seed quality</span><span class="chip">💧 Monitor soil moisture</span><span class="chip">🔎 Scout crop regularly</span><span class="chip">📅 Track field tasks</span><span class="chip">🌦️ Review local weather</span></div><div class="note">Indicative planning information only. Variety, soil test, rainfall, crop stage and local recommendations can change the right practice for a specific farm.</div></aside></div>`;
 }catch(e){document.getElementById("app").innerHTML='<div class="card">'+esc(e.message)+'</div>'}
}
load();
</script></body></html>
