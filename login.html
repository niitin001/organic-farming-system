<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | Farmer Friendly</title><link rel="stylesheet" href="styles.css"></head>
<body class="auth-page"><main class="auth-box">
<a class="auth-logo" href="index.html"><span>🌱</span> Farmer Friendly</a>
<h1>Welcome back.</h1><p>Sign in to manage your crops, farm plans, orders and saved recommendations.</p>
<form id="loginForm"><input type="email" id="email" placeholder="Email address" autocomplete="email" required><input type="password" id="password" placeholder="Password" autocomplete="current-password" required><button type="submit">Sign in →</button></form>
<p class="switch">New to Farmer Friendly? <a href="signup.html">Create an account</a></p><a class="back-home" href="index.html">← Back to home</a>
</main><script>
document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();const email=document.getElementById("email").value.trim().toLowerCase(),password=document.getElementById("password").value;if(!email||!password)return;const btn=e.target.querySelector("button");btn.disabled=true;btn.textContent="Signing in…";try{const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Login failed.");localStorage.setItem("ffs_token",d.token);localStorage.setItem("ffs_user",JSON.stringify(d.user));localStorage.setItem("ffs_logged",d.user.email);const next=new URLSearchParams(location.search).get("next");location.href=next||"index.html";}catch(err){alert(err.message)}finally{btn.disabled=false;btn.textContent="Sign in →"}});
</script></body></html>
