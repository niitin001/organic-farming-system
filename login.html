<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login - Farmer Friendly</title>
<style>
body{margin:0;background:#0b3f0d;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:Arial,sans-serif}
.box{background:#fff;width:min(360px,90vw);padding:28px;border-radius:12px;text-align:center;box-shadow:0 12px 35px rgba(0,0,0,.25)}
input{box-sizing:border-box;width:100%;margin:8px 0;padding:11px;border:1px solid #aaa;border-radius:6px}
button{width:100%;padding:11px;background:#0b3f0d;color:#fff;border:0;border-radius:6px;cursor:pointer;margin-top:10px}
a{color:#0b3f0d}
</style>
</head>
<body>
<div class="box">
<h2>Login</h2>
<input type="email" id="email" placeholder="Enter Email" required>
<input type="password" id="password" placeholder="Password" required>
<button onclick="login()">Login</button>
<p>Don't have an account? <a href="signup.html">Sign up</a></p>
</div>
<script>
async function login(){
  const email=document.getElementById("email").value.trim().toLowerCase();
  const password=document.getElementById("password").value;
  if(!email||!password){alert("Enter email and password.");return}
  try{
    const response=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password})});
    const data=await response.json();
    if(!response.ok) throw new Error(data.error||"Login failed.");
    localStorage.setItem("ffs_token",data.token);
    localStorage.setItem("ffs_user",JSON.stringify(data.user));
    localStorage.setItem("ffs_logged",data.user.email);
    window.location.href="index.html";
  }catch(error){alert(error.message)}
}
</script>
</body>
</html>
