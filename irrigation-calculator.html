<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Irrigation Calculator | Farmer Friendly</title><link rel="stylesheet" href="styles.css"><style>body{padding-top:86px}.wrap{padding:55px 0 80px}.card{max-width:760px;margin:auto;background:#fff;border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 8px 30px rgba(8,48,36,.05)}.k{font-size:11px;letter-spacing:.16em;font-weight:900;color:var(--green)}h1{font:800 clamp(34px,5vw,54px)/1.05 Manrope;margin:10px 0;letter-spacing:-.05em}h1 span{color:var(--green)}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:25px}label{font-size:12px;font-weight:800}select,input{width:100%;padding:13px;margin-top:7px;border:1px solid var(--line);border-radius:11px}.btn{grid-column:1/-1;padding:14px;border:0;border-radius:11px;background:var(--green-dark);color:#fff;font-weight:800;cursor:pointer}.result{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}.stat{padding:20px;background:var(--green-soft);border-radius:15px}.stat small{color:var(--muted)}.stat b{display:block;font:800 25px Manrope;margin-top:4px}.note{margin-top:18px;font-size:11px;color:var(--muted)}@media(max-width:650px){.grid,.result{grid-template-columns:1fr}.btn{grid-column:auto}}</style></head><body><header class="site-header"><div class="header-inner"><a class="brand" href="index.html"><span class="brand-mark">🌱</span><span><strong>Farmer</strong> Friendly</span></a><nav class="main-nav"><a href="dashboard.html">Dashboard</a><a href="farm-planner.html">Planner</a><a href="marketplace.html">Marketplace</a></nav></div></header><main class="wrap"><div class="card"><div class="k">SMART FARM TOOL</div><h1>Irrigation <span>Calculator.</span></h1><p class="muted">Get a simple planning estimate from area, crop, soil and irrigation method.</p><div class="grid"><div><label>Area (acres)</label><input id="area" type="number" min="0.1" step="0.1" value="1"></div><div><label>Crop</label><select id="crop"><option>Rice</option><option>Wheat</option><option>Soybean</option><option>Maize</option><option>Groundnut</option><option>Mustard</option><option>Gram (Chickpea)</option><option>Moong Bean</option><option>Vegetables</option></select></div><div><label>Soil</label><select id="soil"><option value="loamy">Loamy</option><option value="black">Black</option><option value="clay">Clay</option><option value="sandy">Sandy</option></select></div><div><label>Method</label><select id="method"><option value="drip">Drip</option><option value="sprinkler">Sprinkler</option><option value="flood">Flood / Surface</option></select></div><button class="btn" onclick="calc()">Calculate requirement</button></div><div id="out"></div><p class="note">Planning estimate only — actual irrigation depends on crop stage, weather, rainfall, soil moisture and local practice.</p></div></main><script>async function calc(){const r=await fetch("/api/irrigation-calculator",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({area:Number(area.value),crop:crop.value,soil:soil.value,method:method.value})});const d=await r.json();out.innerHTML=r.ok?'<div class="result"><div class="stat"><small>Estimated daily</small><b>'+d.daily_liters.toLocaleString("en-IN")+' L</b></div><div class="stat"><small>Estimated weekly</small><b>'+d.weekly_liters.toLocaleString("en-IN")+' L</b></div></div>':'<p class="note">'+d.error+'</p>'}</script></body></html>
