<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marketplace | Farmer Friendly</title><link rel="stylesheet" href="styles.css"><style>
.market{max-width:1180px;margin:105px auto 60px;padding:0 22px}.market-hero{background:linear-gradient(135deg,#103e2d,#367d38);color:#fff;border-radius:28px;padding:38px 32px;margin-bottom:22px}.market-hero h1{font-size:clamp(2rem,5vw,3.3rem);margin:8px 0}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}.toolbar input,.toolbar select{padding:13px 15px;border:1px solid #dbe6de;border-radius:12px;background:#fff}.toolbar input{flex:1;min-width:220px}.toolbar select{min-width:160px}.cartbar{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid #e4ece6;border-radius:16px;padding:14px 18px;margin-bottom:18px}.cartbtn,.buybtn{border:0;border-radius:11px;padding:11px 16px;font-weight:800;cursor:pointer}.cartbtn{background:#173f2d;color:#fff}.buybtn{background:#e8f5ea;color:#216535}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.product{background:#fff;border:1px solid #e4ece6;border-radius:20px;overflow:hidden;box-shadow:0 10px 28px rgba(0,0,0,.05)}.product img{width:100%;height:190px;object-fit:cover}.product-body{padding:18px}.cat{font-size:.75rem;font-weight:800;color:#28703a;text-transform:uppercase}.product h2{font-size:1.1rem;margin:8px 0}.price{font-size:1.35rem;font-weight:900}.stock{font-size:.82rem;color:#66736b;margin:6px 0 14px}.actions{display:flex;gap:8px}.cart{position:fixed;right:20px;bottom:20px;width:min(380px,calc(100% - 40px));background:#fff;border:1px solid #dce7df;border-radius:20px;box-shadow:0 20px 50px rgba(0,0,0,.16);padding:20px;display:none;z-index:10}.cart.open{display:block}.cart-item{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #edf1ee}.checkout{width:100%;padding:13px;border:0;border-radius:12px;background:#26703a;color:#fff;font-weight:900;margin-top:14px;cursor:pointer}.msg{text-align:center;padding:30px;background:#f7faf8;border-radius:18px;grid-column:1/-1}@media(max-width:900px){.products{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.products{grid-template-columns:1fr}.market{margin-top:92px}}
</style></head><body>
<nav class="navbar"><a href="index.html" class="brand">🌱 Farmer Friendly</a><div class="nav-links"><a href="dashboard.html">Dashboard</a><a href="crop-recommendation.html">Smart Crop</a><a href="weather.html">Weather</a></div></nav>
<main class="market"><section class="market-hero"><span>MARKETPLACE • FARM INPUTS</span><h1>Buy smarter. Farm better.</h1><p>Seeds, organic fertilizers, bio-pesticides and practical farm tools — with stock and order tracking backed by PostgreSQL.</p></section>
<div class="toolbar"><input id="search" placeholder="Search products…"><select id="category"><option value="">All categories</option><option>Seeds</option><option>Fertilizers</option><option>Bio-Pesticides</option><option>Farm Tools</option></select></div>
<div class="cartbar"><strong id="count">0 items</strong><span id="total">₹0</span><button class="cartbtn" onclick="toggleCart()">🛒 View Cart</button></div>
<section id="products" class="products"></section></main>
<aside id="cart" class="cart"><h2>🛒 Your Cart</h2><div id="cartItems"></div><strong id="cartTotal">Total: ₹0</strong><button class="checkout" onclick="checkout()">Place Order</button><p id="cartMsg"></p></aside>
<script>
let products=[],cart=JSON.parse(localStorage.getItem("ff_cart")||"{}");
const $=id=>document.getElementById(id);
function money(n){return "₹"+Number(n).toLocaleString("en-IN",{maximumFractionDigits:2});}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));}
async function load(){const q=$("search").value.trim(),cat=$("category").value;const r=await fetch("/api/products?category="+encodeURIComponent(cat)+"&q="+encodeURIComponent(q));const d=await r.json();products=d.products||[];render();}
function render(){if(!products.length){$("products").innerHTML="<div class='msg'>No products found.</div>";return;}$("products").innerHTML=products.map(p=>"<article class='product'><img src='"+esc(p.image)+"' alt='"+esc(p.name)+"'><div class='product-body'><span class='cat'>"+esc(p.category)+"</span><h2>"+esc(p.name)+"</h2><div class='price'>"+money(p.price)+"</div><div class='stock'>"+(p.stock>0?p.stock+" in stock":"Out of stock")+"</div><div class='actions'><button class='buybtn' "+(p.stock?"":"disabled")+" onclick='add("+p.id+")'>Add to Cart</button></div></div></article>").join("");updateCart();}
function add(id){cart[id]=(cart[id]||0)+1;localStorage.setItem("ff_cart",JSON.stringify(cart));updateCart();toggleCart(true);}
function updateCart(){let total=0,count=0;const rows=[];for(const [id,qty] of Object.entries(cart)){const p=products.find(x=>x.id==id);if(!p)continue;total+=Number(p.price)*qty;count+=qty;rows.push("<div class='cart-item'><span>"+esc(p.name)+" × "+qty+"</span><strong>"+money(Number(p.price)*qty)+"</strong></div>");}$("count").textContent=count+" item"+(count===1?"":"s");$("total").textContent=money(total);$("cartItems").innerHTML=rows.length?rows.join(""):"Your cart is empty.";$("cartTotal").textContent="Total: "+money(total);}
function toggleCart(force){$("cart").classList.toggle("open",force===true?!$("cart").classList.contains("open"):undefined);}
async function checkout(){const token=localStorage.getItem("ffs_token");if(!token){alert("Please login first.");location.href="login.html";return;}const items=Object.entries(cart).map(([productId,quantity])=>({productId:Number(productId),quantity}));if(!items.length){$("cartMsg").textContent="Cart is empty.";return;}const r=await fetch("/api/orders",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({items})});const d=await r.json();if(!r.ok){$("cartMsg").textContent=d.error||"Unable to place order.";return;}cart={};localStorage.removeItem("ff_cart");updateCart();$("cartMsg").textContent="Order #"+d.order.id+" placed successfully.";setTimeout(()=>location.href="dashboard.html",1200);}
$("search").addEventListener("input",load);$("category").addEventListener("change",load);load();
</script></body></html>
